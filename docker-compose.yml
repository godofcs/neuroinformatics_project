version: "3.9"
services:
    ai_temp:
        build:
            context: ./temp-ai
            dockerfile: Dockerfile
        ports:
            - "1234:1234"

    backend:
        build:
            context: ./back
            dockerfile: Dockerfile
        ports:
            - "5678:5678"
        depends_on:
            - ai_temp
            - rabbitmq
        environment:
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_PORT=5672
    ui:
        build: "./front"
        ports:
            - "3000:3000"
        depends_on:
            - backend
    rabbitmq:
        image: "rabbitmq:management"
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - "15672:15672" # ui
            - "5672:5672"
